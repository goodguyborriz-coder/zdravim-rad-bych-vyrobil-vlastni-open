<!DOCTYPE html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Rotterdam 3D Open World</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏙️</text></svg>" />
    <style>
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: #0c121c;
      }
      #loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #0d131f;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #fff;
        transition: opacity 0.6s ease;
      }
      .loader-spinner {
        width: 50px;
        height: 50px;
        border: 4px solid rgba(255, 255, 255, 0.15);
        border-top-color: #00d2d3;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 20px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      .loader-title {
        font-size: 24px;
        font-weight: 800;
        letter-spacing: 2px;
        margin-bottom: 8px;
        background: linear-gradient(135deg, #00d2d3, #ff9f43);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .loader-desc {
        font-size: 14px;
        color: #747d8c;
      }
    </style>
  </head>
  <body>
    <div id="loading-screen">
      <div class="loader-spinner"></div>
      <div class="loader-title">ROTTERDAM OPEN WORLD</div>
      <div class="loader-desc">Načítání 3D modelu města Rotterdam a fyzikálního enginu...</div>
    </div>

    <script>
      window.addEventListener('load', () => {
        setTimeout(() => {
          const loader = document.getElementById('loading-screen');
          if (loader) {
            loader.style.opacity = '0';
            setTimeout(() => loader.remove(), 600);
          }
        }, 800);
      });
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
